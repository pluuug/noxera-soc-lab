<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">NØXERA SOC Lab analysis flow</title>
<desc id="desc">Synthetic SSH authentication logs flow through a Python parser and three detection rules into JSON alerts and analyst triage.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10151e"/><stop offset="1" stop-color="#202b3a"/></linearGradient>
  <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#273449"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8da9c8"/></marker>
  <style>.heading{font:700 25px 'Segoe UI',Arial,sans-serif;fill:#f3f6fb}.sub{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#b9c7d9}.nodeTitle{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#f3f6fb}.nodeText{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#c5d2e2}.num{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#10151e}</style>
</defs>
<rect width="1200" height="360" rx="22" fill="url(#bg)"/>
<text x="42" y="48" class="heading">NØXERA SOC LAB</text><text x="42" y="73" class="sub">Authentication log analysis · detection engineering · alert triage</text>
<g stroke="#8da9c8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M265 185 H310"/><path d="M535 185 H580"/><path d="M805 185 H850"/></g>
<g>
<rect x="40" y="118" width="225" height="135" rx="15" fill="url(#node)" stroke="#526984"/><circle cx="66" cy="144" r="12" fill="#90c2ff"/><text x="66" y="148" text-anchor="middle" class="num">1</text><text x="61" y="178" class="nodeTitle">Synthetic logs</text><text x="61" y="202" class="nodeText">Linux SSH auth.log</text><text x="61" y="222" class="nodeText">Reserved example IPs</text>
<rect x="310" y="118" width="225" height="135" rx="15" fill="url(#node)" stroke="#526984"/><circle cx="336" cy="144" r="12" fill="#90c2ff"/><text x="336" y="148" text-anchor="middle" class="num">2</text><text x="331" y="178" class="nodeTitle">Python analyzer</text><text x="331" y="202" class="nodeText">Parse events + timestamps</text><text x="331" y="222" class="nodeText">Group by source IP</text>
<rect x="580" y="118" width="225" height="135" rx="15" fill="url(#node)" stroke="#526984"/><circle cx="606" cy="144" r="12" fill="#90c2ff"/><text x="606" y="148" text-anchor="middle" class="num">3</text><text x="601" y="178" class="nodeTitle">Detection rules</text><text x="601" y="202" class="nodeText">NX-SOC-001 · Brute force</text><text x="601" y="222" class="nodeText">002 · Login after failures</text><text x="601" y="242" class="nodeText">003 · Password spraying</text>
<rect x="850" y="118" width="310" height="135" rx="15" fill="url(#node)" stroke="#526984"/><circle cx="876" cy="144" r="12" fill="#90c2ff"/><text x="876" y="148" text-anchor="middle" class="num">4</text><text x="871" y="178" class="nodeTitle">JSON alerts + triage</text><text x="871" y="202" class="nodeText">Evidence · severity · ATT&amp;CK</text><text x="871" y="222" class="nodeText">Recommendations for analyst review</text>
</g>
<text x="42" y="313" class="sub">Learning lab only — alerts are investigation leads, not proof of compromise.</text>
</svg>
